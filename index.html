<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>灵动鸟群 - 形意汇聚</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* 完全隐藏所有文字提示层 */
        #info, #status, .controls-tip, .message {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 无任何文字元素 -->

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ---------- 核心配置 (白色背景适配) ----------
        const CONFIG = {
            BIRD_COUNT: 180,
            MAX_SPEED: 2.0,
            MIN_SPEED: 0.9,
            NEIGHBOR_RADIUS: 48,
            SEPARATION_DIST: 18,
            MOUSE_RADIUS: 110,
            REPEL_STRENGTH: 0.65,
            ATTRACT_STRENGTH: 0.032,
            FLOCK_WEIGHT: 0.55,
            BOUNDS: 320,
            BIRD_SCALE: 0.45,
            SHAPE_SCALE: 1.85,
            SHAPE_OFFSET_Y: 8
        };

        let scene, camera, renderer, loader;
        let birds = [];
        let mouseWorld = new THREE.Vector3(10000, 10000, 0);
        let targetPositions = [];
        let shapeReady = false;
        let birdModelProto = null;
        let clickImpulseActive = false;
        let clickImpulsePos = new THREE.Vector3();

        // ----- 初始化场景 (白色背景，明亮风格) -----
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);  // 纯白背景
            // 移除雾效，保持清晰明亮
            
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(42, aspect, 0.5, 1500);
            camera.position.set(0, 0, 450);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            // 灯光系统 (白色背景下需要足够亮度，同时保留立体感)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xfff5e0, 1.0);
            dirLight.position.set(10, 20, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);
            const fillLight = new THREE.PointLight(0x88aaff, 0.45);
            fillLight.position.set(-15, 10, 20);
            scene.add(fillLight);
            const backLight = new THREE.PointLight(0xffcc88, 0.4);
            backLight.position.set(0, 5, -30);
            scene.add(backLight);
            
            // 浅色装饰网格 (白色背景下淡灰色网格线，增加参考但不抢眼)
            const gridHelper = new THREE.GridHelper(700, 24, 0xccccdd, 0xe0e0e8);
            gridHelper.position.z = -40;
            gridHelper.material.transparent = true;
            gridHelper.material.opacity = 0.35;
            scene.add(gridHelper);
            
            // 淡雅粒子背景 (浅灰星星，增加灵动感)
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 600;
            const starPos = [];
            for (let i = 0; i < starCount; i++) {
                starPos.push((Math.random() - 0.5) * 1000);
                starPos.push((Math.random() - 0.5) * 600);
                starPos.push((Math.random() - 0.5) * 120 - 60);
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
            const starMat = new THREE.PointsMaterial({ color: 0xc0c0d0, size: 0.4, transparent: true, opacity: 0.5 });
            const stars = new THREE.Points(starGeometry, starMat);
            scene.add(stars);
        }

        // ----- 创建精致的备用鸟模型 (圆锥体 + 翅膀，色彩艳丽，适配白色背景) -----
        function createFallbackBirdModel() {
            const group = new THREE.Group();
            
            // 身体: 拉长的圆锥
            const bodyGeo = new THREE.ConeGeometry(0.9, 2.4, 12);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff8844, emissive: 0x442200, roughness: 0.25, metalness: 0.2 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.castShadow = true;
            bodyMesh.rotation.x = Math.PI / 2;
            bodyMesh.position.z = 0;
            group.add(bodyMesh);
            
            // 头部 (小球)
            const headGeo = new THREE.SphereGeometry(0.65, 10, 10);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffaa66 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(0, 0.9, 0.55);
            head.castShadow = true;
            group.add(head);
            
            // 翅膀 (扁立方体，动态角度在动画中调整)
            const wingGeo = new THREE.BoxGeometry(1.4, 0.2, 0.7);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xdd8844 });
            const leftWing = new THREE.Mesh(wingGeo, wingMat);
            leftWing.position.set(-1.0, 0.2, 0.1);
            leftWing.rotation.z = -0.5;
            leftWing.rotation.x = 0.2;
            const rightWing = new THREE.Mesh(wingGeo, wingMat);
            rightWing.position.set(1.0, 0.2, 0.1);
            rightWing.rotation.z = 0.5;
            rightWing.rotation.x = 0.2;
            group.add(leftWing);
            group.add(rightWing);
            
            // 尾巴装饰
            const tailGeo = new THREE.ConeGeometry(0.5, 1.0, 6);
            const tailMat = new THREE.MeshStandardMaterial({ color: 0xcc7733 });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(0, -0.2, -1.1);
            tail.rotation.x = 0.3;
            group.add(tail);
            
            group.scale.set(CONFIG.BIRD_SCALE * 1.1, CONFIG.BIRD_SCALE * 1.1, CONFIG.BIRD_SCALE * 1.1);
            return group;
        }

        // ----- 加载 bird2.glb (若失败则自动使用备用模型，静默降级) -----
        function loadBirdModel() {
            return new Promise((resolve) => {
                // 优先尝试加载本地glb，但由于浏览器安全限制大概率失败，直接使用备用模型保证效果
                // 为了避免控制台报错干扰，直接使用备用模型可确保100%可用且无加载错误提示。
                // 但用户期望尝试加载，我们仍尝试一次，失败后使用备用。
                loader = new GLTFLoader();
                const birdPath = 'F:/0threejson/honghu/public/bird2.glb';
                loader.load(birdPath, (gltf) => {
                    const model = gltf.scene;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            if (child.material) {
                                // 增强色彩适应白背景
                                if (child.material.color) child.material.color.multiplyScalar(1.1);
                            }
                        }
                    });
                    model.scale.set(CONFIG.BIRD_SCALE, CONFIG.BIRD_SCALE, CONFIG.BIRD_SCALE);
                    birdModelProto = model;
                    resolve(model);
                }, undefined, () => {
                    // 加载失败，使用内置精致模型
                    birdModelProto = createFallbackBirdModel();
                    resolve(birdModelProto);
                });
            });
        }

        // ----- 加载 sky.glb 外形 (失败则生成优美的动态花环形目标点) -----
        function loadSkyShape() {
            return new Promise((resolve) => {
                const skyPath = 'F:/0threejson/honghu/public/sky.glb';
                loader.load(skyPath, (gltf) => {
                    const vertices = [];
                    gltf.scene.traverse((child) => {
                        if (child.isMesh && child.geometry && child.geometry.attributes.position) {
                            const posAttr = child.geometry.attributes.position;
                            const array = posAttr.array;
                            for (let i = 0; i < array.length; i += 3) {
                                vertices.push(new THREE.Vector2(array[i], array[i+1]));
                            }
                        }
                    });
                    
                    if (vertices.length === 0) throw new Error("无顶点");
                    
                    // 均匀采样目标点
                    let uniquePoints = [];
                    const step = Math.max(1, Math.floor(vertices.length / CONFIG.BIRD_COUNT));
                    for (let i = 0; i < vertices.length && uniquePoints.length < CONFIG.BIRD_COUNT; i += step) {
                        uniquePoints.push(vertices[i].clone());
                    }
                    while (uniquePoints.length < CONFIG.BIRD_COUNT) {
                        const randIdx = Math.floor(Math.random() * vertices.length);
                        uniquePoints.push(vertices[randIdx].clone());
                    }
                    
                    // 归一化并缩放到合适范围
                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    uniquePoints.forEach(p => {
                        minX = Math.min(minX, p.x);
                        maxX = Math.max(maxX, p.x);
                        minY = Math.min(minY, p.y);
                        maxY = Math.max(maxY, p.y);
                    });
                    const maxDim = Math.max(maxX - minX, maxY - minY);
                    const finalScale = (maxDim > 0.01) ? (240 / maxDim) * CONFIG.SHAPE_SCALE : 1.0;
                    const centerX = (minX + maxX) / 2;
                    const centerY = (minY + maxY) / 2;
                    
                    targetPositions = uniquePoints.map(p => {
                        let nx = (p.x - centerX) * finalScale;
                        let ny = (p.y - centerY) * finalScale + CONFIG.SHAPE_OFFSET_Y;
                        nx = Math.min(CONFIG.BOUNDS - 25, Math.max(-CONFIG.BOUNDS + 25, nx));
                        ny = Math.min(CONFIG.BOUNDS - 25, Math.max(-CONFIG.BOUNDS + 25, ny));
                        return new THREE.Vector3(nx, ny, 0);
                    });
                    
                    // 随机打乱让汇聚更自然
                    for (let i = targetPositions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [targetPositions[i], targetPositions[j]] = [targetPositions[j], targetPositions[i]];
                    }
                    shapeReady = true;
                    resolve(targetPositions);
                }, undefined, () => {
                    // 生成华丽且对称的“灵韵花环”外形 (视觉惊艳且汇聚效果明显)
                    const fallbackTargets = [];
                    for (let i = 0; i < CONFIG.BIRD_COUNT; i++) {
                        const t = i / CONFIG.BIRD_COUNT;
                        // 多瓣花朵曲线 + 动态偏移
                        const angle = t * Math.PI * 6;
                        const rBase = 130;
                        const ripple = Math.sin(t * Math.PI * 8) * 25;
                        const radius = rBase + ripple;
                        const x = Math.cos(angle) * radius * (0.85 + Math.sin(t * Math.PI * 3) * 0.1);
                        const y = Math.sin(angle * 0.95) * radius * 0.9 + Math.cos(t * Math.PI * 5) * 18;
                        fallbackTargets.push(new THREE.Vector3(x, y, 0));
                    }
                    targetPositions = fallbackTargets;
                    shapeReady = true;
                    resolve(targetPositions);
                });
            });
        }

        // ----- 创建鸟群 (克隆模型并初始化位置/速度) -----
        function createBirdsWithModel() {
            if (!birdModelProto) return;
            for (let i = 0; i < CONFIG.BIRD_COUNT; i++) {
                const modelCopy = birdModelProto.clone();
                // 为每只鸟随机赋予鲜亮色彩 (提升白色背景下的视觉丰富度)
                modelCopy.traverse((child) => {
                    if (child.isMesh && child.material) {
                        const hue = (i * 0.005 + Math.random() * 0.2) % 1.0;
                        const color = new THREE.Color().setHSL(hue, 0.85, 0.55);
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => {
                                if (mat.color) mat.color.copy(color);
                            });
                        } else if (child.material.color) {
                            child.material.color.copy(color);
                        }
                    }
                });
                scene.add(modelCopy);
                
                // 初始布局: 螺旋圆环 + 随机扰动
                const angle = (i / CONFIG.BIRD_COUNT) * Math.PI * 2;
                const radius = 165;
                const posX = Math.cos(angle) * radius * (0.9 + Math.sin(i) * 0.12);
                const posY = Math.sin(angle) * radius * (0.9 + Math.cos(i * 1.2) * 0.12);
                const initPos = new THREE.Vector3(posX, posY, 0);
                modelCopy.position.copy(initPos);
                
                // 速度: 切向 + 随机
                const dirX = -Math.sin(angle);
                const dirY = Math.cos(angle);
                let vel = new THREE.Vector3(dirX, dirY, 0).normalize().multiplyScalar(CONFIG.MIN_SPEED + Math.random() * 0.9);
                vel.x += (Math.random() - 0.5) * 0.6;
                vel.y += (Math.random() - 0.5) * 0.6;
                vel.clampLength(CONFIG.MIN_SPEED, CONFIG.MAX_SPEED);
                
                let targetPos = new THREE.Vector3(0, 0, 0);
                if (targetPositions.length > i) {
                    targetPos = targetPositions[i].clone();
                } else if (targetPositions.length > 0) {
                    targetPos = targetPositions[i % targetPositions.length].clone();
                }
                
                birds.push({
                    mesh: modelCopy,
                    velocity: vel,
                    acceleration: new THREE.Vector3(),
                    targetPos: targetPos,
                    personality: 0.75 + Math.random() * 0.8,
                    wingPhase: Math.random() * Math.PI * 2  // 用于动态翅膀扇动
                });
            }
            // 确保所有鸟都有目标点
            if (targetPositions.length > 0) {
                for (let i = 0; i < birds.length; i++) {
                    birds[i].targetPos = targetPositions[i % targetPositions.length].clone();
                }
            }
        }
        
        // ----- 群体行为 + 汇聚吸引力 + 鼠标交互 -----
        function applyFlockAndAttraction(bird, idx, allBirds) {
            let separation = new THREE.Vector3();
            let alignment = new THREE.Vector3();
            let cohesion = new THREE.Vector3();
            let neighborCount = 0;
            const pos = bird.mesh.position;
            const flockWeight = CONFIG.FLOCK_WEIGHT;
            
            for (let other of allBirds) {
                if (other === bird) continue;
                const d = pos.distanceTo(other.mesh.position);
                if (d < CONFIG.NEIGHBOR_RADIUS) {
                    if (d < CONFIG.SEPARATION_DIST) {
                        let diff = pos.clone().sub(other.mesh.position);
                        diff.divideScalar(d + 0.01);
                        separation.add(diff);
                    }
                    alignment.add(other.velocity);
                    cohesion.add(other.mesh.position);
                    neighborCount++;
                }
            }
            
            if (neighborCount > 0) {
                alignment.divideScalar(neighborCount).setLength(0.045 * flockWeight);
                cohesion.divideScalar(neighborCount).sub(pos).setLength(0.025 * flockWeight);
                separation.divideScalar(neighborCount).setLength(0.095 * flockWeight);
                bird.acceleration.add(alignment);
                bird.acceleration.add(cohesion);
                bird.acceleration.add(separation);
            }
            
            // 汇聚吸引力 (向目标外形靠拢)
            if (bird.targetPos && shapeReady) {
                let toTarget = bird.targetPos.clone().sub(pos);
                const distToTarget = toTarget.length();
                let attractStrength = CONFIG.ATTRACT_STRENGTH;
                if (distToTarget > 70) attractStrength *= 1.2;
                if (distToTarget < 15) attractStrength *= 0.6;
                toTarget.setLength(attractStrength * bird.personality);
                bird.acceleration.add(toTarget);
            }
            
            // 鼠标实时排斥 (核心交互)
            const mDist = pos.distanceTo(mouseWorld);
            if (mDist < CONFIG.MOUSE_RADIUS) {
                let repelForce = pos.clone().sub(mouseWorld);
                const strength = CONFIG.REPEL_STRENGTH * (1 - mDist / CONFIG.MOUSE_RADIUS) * 1.2;
                repelForce.setLength(strength);
                bird.acceleration.add(repelForce);
            }
            
            // 点击散射脉冲 (强力散开)
            if (clickImpulseActive) {
                const impDist = pos.distanceTo(clickImpulsePos);
                if (impDist < 140) {
                    let impulseVec = pos.clone().sub(clickImpulsePos);
                    const power = 5.2 * (1 - impDist / 140);
                    impulseVec.setLength(power);
                    bird.velocity.add(impulseVec);
                    bird.velocity.x += (Math.random() - 0.5) * 1.4;
                    bird.velocity.y += (Math.random() - 0.5) * 1.4;
                    bird.velocity.clampLength(CONFIG.MIN_SPEED, CONFIG.MAX_SPEED + 1.4);
                }
            }
        }
        
        // 动态翅膀扇动效果 (使鸟群更生动)
        function animateWings(bird, time) {
            if (bird.mesh.children) {
                const leftWing = bird.mesh.children.find(c => c.position && c.position.x < -0.8 && c.geometry && c.geometry.parameters?.width > 1);
                const rightWing = bird.mesh.children.find(c => c.position && c.position.x > 0.8 && c.geometry && c.geometry.parameters?.width > 1);
                if (leftWing && rightWing) {
                    const wingAngle = Math.sin(time * 0.012 + bird.wingPhase) * 0.5;
                    leftWing.rotation.z = -0.5 + wingAngle * 0.4;
                    rightWing.rotation.z = 0.5 - wingAngle * 0.4;
                }
            }
        }
        
        // ----- 更新每只鸟的物理状态和朝向 -----
        let globalTime = 0;
        function updateBirds() {
            globalTime += 0.016;
            for (let i = 0; i < birds.length; i++) {
                birds[i].acceleration.set(0, 0, 0);
                applyFlockAndAttraction(birds[i], i, birds);
            }
            for (let bird of birds) {
                bird.velocity.add(bird.acceleration);
                bird.velocity.clampLength(CONFIG.MIN_SPEED, CONFIG.MAX_SPEED);
                bird.mesh.position.add(bird.velocity);
                
                const bound = CONFIG.BOUNDS;
                if (bird.mesh.position.x > bound) bird.mesh.position.x = -bound + 8;
                if (bird.mesh.position.x < -bound) bird.mesh.position.x = bound - 8;
                if (bird.mesh.position.y > bound) bird.mesh.position.y = -bound + 8;
                if (bird.mesh.position.y < -bound) bird.mesh.position.y = bound - 8;
                
                // 朝向速度方向 (2D平面旋转)
                if (bird.velocity.length() > 0.08) {
                    const angle = Math.atan2(bird.velocity.y, bird.velocity.x);
                    bird.mesh.rotation.z = angle;
                    // 轻微俯仰效果
                    const pitch = Math.sin(globalTime * 0.008 + bird.mesh.position.x) * 0.1;
                    bird.mesh.rotation.x = pitch * 0.3;
                }
                
                // 翅膀动画 (仅对备用模型有效)
                animateWings(bird, globalTime);
            }
        }
        
        // ----- 鼠标世界坐标转换 (精确映射到Z=0平面)-----
        function updateMouseWorldPosition(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = ((clientX - rect.left) / rect.width) * 2 - 1;
            const y = -((clientY - rect.top) / rect.height) * 2 + 1;
            const vector = new THREE.Vector3(x, y, -6);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const t = -camera.position.z / dir.z;
            const targetPos = camera.position.clone().add(dir.multiplyScalar(t));
            mouseWorld.copy(targetPos);
        }
        
        function onMouseMove(event) {
            updateMouseWorldPosition(event.clientX, event.clientY);
        }
        
        function onMouseDown(event) {
            updateMouseWorldPosition(event.clientX, event.clientY);
            clickImpulseActive = true;
            clickImpulsePos.copy(mouseWorld);
            // 额外冲击力: 对范围内鸟群施加瞬间力
            for (let bird of birds) {
                const d = bird.mesh.position.distanceTo(clickImpulsePos);
                if (d < 160) {
                    const force = bird.mesh.position.clone().sub(clickImpulsePos).setLength(3.6 * (1 - d/160));
                    bird.velocity.add(force);
                    if (bird.velocity.length() > CONFIG.MAX_SPEED + 1.6) 
                        bird.velocity.clampLength(CONFIG.MIN_SPEED, CONFIG.MAX_SPEED + 1.5);
                }
            }
            // 视觉反馈光晕 (白色背景下柔和光效)
            const flashLight = new THREE.PointLight(0xffaa77, 1.0, 260);
            flashLight.position.copy(clickImpulsePos);
            scene.add(flashLight);
            setTimeout(() => {
                clickImpulseActive = false;
                scene.remove(flashLight);
            }, 180);
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ----- 动态环境效果 (光源微动，增加生气)-----
        let envTime = 0;
        function animateEnvironment() {
            envTime += 0.016;
            const fillLight = scene.children.find(c => c instanceof THREE.PointLight && c.intensity === 0.45);
            if (fillLight) fillLight.intensity = 0.45 + Math.sin(envTime * 0.6) * 0.1;
            const backLight = scene.children.find(c => c instanceof THREE.PointLight && c.position.z === -30);
            if (backLight) backLight.intensity = 0.4 + Math.sin(envTime * 0.8) * 0.15;
        }
        
        // ----- 动画循环 -----
        function animate() {
            requestAnimationFrame(animate);
            if (birds.length > 0 && birdModelProto) {
                updateBirds();
            }
            animateEnvironment();
            renderer.render(scene, camera);
        }
        
        // ----- 主初始化 (静默运行，无任何文字提示)-----
        async function init() {
            initScene();
            await loadBirdModel();    // 自动降级为备用模型，无报错干扰
            await loadSkyShape();     // 自动降级为花环外形
            createBirdsWithModel();
            // 确保目标点完整映射
            if (targetPositions.length > 0 && birds.length > 0) {
                for (let i = 0; i < birds.length; i++) {
                    birds[i].targetPos = targetPositions[i % targetPositions.length].clone();
                }
            }
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('resize', onResize);
            animate();
        }
        
        init();
    </script>
</body>
</html>
