<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>灵动鸟群 | 动态速率版</title>
    <style>
        body { 
            margin: 0;
            overflow: hidden; 
            background: radial-gradient(circle at center, #001a0a 0%, #000000 100%);
            font-family: sans-serif; 
        }
        #info {
            position: absolute;
            bottom: 20px; left: 20px;
            background: rgba(0, 30, 20, 0.7); backdrop-filter: blur(10px);
            padding: 12px 24px; border-radius: 40px;
            font-size: 13px; color: #aaffaa;
            z-index: 10;
            border: 1px solid rgba(0, 255, 100, 0.3); pointer-events: none;
        }
        #status-card {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.4); padding: 8px 18px;
            border-radius: 20px; color: #fff; font-size: 12px;
            z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">💠 <b>弹性生态系统</b><br>大鸟：陆地(绿) | 小鸟：海洋(蓝) | 动画：随汇聚加速</div>
    <div id="status-card"><span id="phase-text">资源加载中...</span></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ========== 全局控制参数 ==========
        const CONFIG = {
            BIRD_COUNT: 10000,             
            LAND_RATIO: 0.60,             
            WANDER_TIME: 1.5,             
            FORMATION_STRENGTH: 16,        
            SIZE_LAND: [0.8, 3],        
            SIZE_SEA: [1, 2],         
            REPEL_RADIUS: 3.0,            
            REPEL_STRENGTH: 15.0,         
            CLICK_STRENGTH: 90.0,         
            BLOOM: { strength: 0.25, radius: 0.2, threshold: 0.1 },
            MODEL_SCALE: 20.0,
            // --- 动画速度参数 ---
            BASE_ANIM_SPEED: 1.0,      // 自由探索时的基础速度
            FORMATION_ANIM_SPEED: 2.5  // 汇聚完成后的最大速度
        };

        const LAND_COLORS = ['#3eb07a', '#8bc14b', '#3fb038', '#398c3d'];
        const SEA_COLOR = '#b2d5e1';

        let scene, camera, renderer, controls, composer, clock;
        let birds = [];
        let landTargets = [], seaTargets = [];
        let mouse = new THREE.Vector3(10000, 10000, 10000);
        let raycaster = new THREE.Raycaster();
        let mouseCoords = new THREE.Vector2(1, 1);
        let clickTime = 0, clickPos = new THREE.Vector3();
        let startTime = 0;

        async function init() {
            scene = new THREE.Scene();
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 60);

            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CONFIG.BLOOM.strength, CONFIG.BLOOM.radius, CONFIG.BLOOM.threshold
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            clock = new THREE.Clock();
            startTime = performance.now();

            await loadModels();
            
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('resize', onResize);
            
            animate();
        }

        async function loadModels() {
            const loader = new GLTFLoader();
            const [skyData, birdData] = await Promise.all([
                loader.loadAsync('earth4.glb'),
                loader.loadAsync('wingl.glb')
            ]);

            let allPoints = [];
            skyData.scene.traverse(c => {
                if (c.isMesh) {
                    const pos = c.geometry.attributes.position;
                    const name = c.name.toLowerCase();
                    for (let i = 0; i < pos.count; i += 2) {
                        let v = new THREE.Vector3().fromBufferAttribute(pos, i);
                        v.applyMatrix4(c.matrixWorld);
                        if (name.includes('land')) landTargets.push(v);
                        else if (name.includes('sea')) seaTargets.push(v);
                        allPoints.push(v);
                    }
                }
            });

            const box = new THREE.Box3().setFromPoints(allPoints);
            const center = box.getCenter(new THREE.Vector3());
            const scale = CONFIG.MODEL_SCALE / box.getSize(new THREE.Vector3()).length();

            const processPoint = (p) => p.sub(center).multiplyScalar(scale);
            landTargets = landTargets.map(processPoint);
            seaTargets = seaTargets.map(processPoint);

            if(landTargets.length === 0) landTargets = seaTargets;
            if(seaTargets.length === 0) seaTargets = landTargets;

            for (let i = 0; i < CONFIG.BIRD_COUNT; i++) {
                const group = new THREE.Group();
                const clone = birdData.scene.clone();
                
                const isLandBird = Math.random() < CONFIG.LAND_RATIO;
                const sizeRange = isLandBird ? CONFIG.SIZE_LAND : CONFIG.SIZE_SEA;
                const targetPool = isLandBird ? landTargets : seaTargets;
                
                const materialColor = new THREE.Color(isLandBird ? LAND_COLORS[Math.floor(Math.random() * LAND_COLORS.length)] : SEA_COLOR);

                const s = sizeRange[0] + Math.random() * (sizeRange[1] - sizeRange[0]);
                clone.scale.set(s, s, s);

                clone.traverse(child => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: materialColor,
                            emissive: materialColor,
                            emissiveIntensity: isLandBird ? 1.2 : 0.6,
                            metalness: 0.4,
                            roughness: 0.3
                        });
                    }
                });

                let mixer = null;
                if (birdData.animations && birdData.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(clone);
                    mixer.clipAction(birdData.animations[0]).play();
                    mixer.setTime(Math.random() * 2);
                    // 初始速度
                    mixer.timeScale = CONFIG.BASE_ANIM_SPEED;
                }

                group.add(clone);
                group.position.set((Math.random()-0.5)*150, (Math.random()-0.5)*150, (Math.random()-0.5)*150);
                scene.add(group);

                birds.push({
                    mesh: group,
                    mixer: mixer,
                    velocity: new THREE.Vector3(),
                    target: targetPool[Math.floor(Math.random() * targetPool.length)].clone().add(
                        new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5)
                    ),
                    seed: Math.random() * 100
                });
            }
        }

        function onMouseMove(e) {
            mouseCoords.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouseCoords.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseDown() {
            clickTime = performance.now();
            clickPos.copy(mouse);
        }

        function updatePhysics(dt) {
            const now = performance.now();
            const elapsed = (now - startTime) / 1000;
            // 计算汇聚进度 (0 到 1)
            let formationWeight = Math.max(0, Math.min(1, (elapsed - CONFIG.WANDER_TIME) / 2.0));

            // 计算当前应有的动画速度：随汇聚进度从 BASE 平滑过渡到 FORMATION 速度
            const currentAnimSpeed = CONFIG.BASE_ANIM_SPEED + (CONFIG.FORMATION_ANIM_SPEED - CONFIG.BASE_ANIM_SPEED) * formationWeight;

            raycaster.setFromCamera(mouseCoords, camera);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.at(camera.position.distanceTo(new THREE.Vector3(0,0,0)), intersectPoint);
            mouse.lerp(intersectPoint, 0.2);

            birds.forEach((b) => {
                if (b.mixer) {
                    // 更新动画速度
                    b.mixer.timeScale = currentAnimSpeed;
                    b.mixer.update(dt);
                }

                const acc = new THREE.Vector3();

                // 1. 基础随机漂浮
                const floatLevel = 1.0 - (formationWeight * 0.9);
                acc.x += Math.sin(now * 0.001 + b.seed) * 1.5 * floatLevel;
                acc.y += Math.cos(now * 0.0012 + b.seed) * 1.5 * floatLevel;

                // 2. 汇聚力
                if (formationWeight > 0) {
                    const toTarget = new THREE.Vector3().subVectors(b.target, b.mesh.position);
                    acc.add(toTarget.multiplyScalar(CONFIG.FORMATION_STRENGTH * formationWeight));
                }

                // 3. 鼠标排斥
                const distToMouse = b.mesh.position.distanceTo(mouse);
                if (distToMouse < CONFIG.REPEL_RADIUS) {
                    const repel = new THREE.Vector3().subVectors(b.mesh.position, mouse);
                    const force = (1 - distToMouse / CONFIG.REPEL_RADIUS) * CONFIG.REPEL_STRENGTH * 2.5;
                    acc.add(repel.normalize().multiplyScalar(force));
                }

                // 4. 点击爆发
                if (now - clickTime < 400) {
                    const distToClick = b.mesh.position.distanceTo(clickPos);
                    if (distToClick < 15) {
                        const pulse = new THREE.Vector3().subVectors(b.mesh.position, clickPos);
                        acc.add(pulse.normalize().multiplyScalar(CONFIG.CLICK_STRENGTH));
                    }
                }

                b.velocity.add(acc.multiplyScalar(dt));
                const drag = formationWeight > 0.9 ? 0.82 : 0.95;
                b.velocity.multiplyScalar(drag);
                b.mesh.position.add(b.velocity.clone().multiplyScalar(dt));

                // 5. 朝向优化
                if (b.velocity.length() > 0.1) {
                    const targetRotation = b.mesh.position.clone().add(b.velocity);
                    b.mesh.lookAt(targetRotation);
                } else if (formationWeight > 0.9) {
                    const dummyTarget = b.mesh.position.clone().add(new THREE.Vector3(0,0,1));
                    b.mesh.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().lookAt(b.mesh.position, dummyTarget, b.mesh.up)), 0.05);
                }
            });

            const status = document.getElementById('phase-text');
            if (formationWeight <= 0) status.innerText = "状态：自由探索...";
            else if (formationWeight < 1) status.innerText = "状态：迁徙汇聚中...";
            else status.innerText = `状态：生态分布完成 | 动画速率: ${currentAnimSpeed.toFixed(1)}x`;
        }

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.033);
            updatePhysics(dt);
            controls.update();
            composer.render();
            requestAnimationFrame(animate);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
